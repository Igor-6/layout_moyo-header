<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOYO Header</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="header">
  <div class="header__inner">

    <a href="images/logo.png" class="logo" aria-label="MOYO">
      <div class="logo__grid">
        <div class="logo__cell logo__cell--mo-1">M</div>
        <div class="logo__cell logo__cell--mo-2">O</div>
        <div class="logo__cell logo__cell--yo-1">Y</div>
        <div class="logo__cell logo__cell--yo-2">O</div>
      </div>
    </a>

    <nav class="nav" aria-label="Головна навігація">
      <div class="nav__item"><a href="#" class="nav__link nav__link--active nav__link--underline">Apple</a></div>
      <div class="nav__item"><a href="#" class="nav__link">Samsung</a></div>
      <div class="nav__item"><a href="#" class="nav__link">Smartphones</a></div>
      <div class="nav__item"><a href="#" class="nav__link nav__link--active">Laptops &amp; Computers</a></div>
      <div class="nav__item"><a href="#" class="nav__link">Gadgets</a></div>
      <div class="nav__item"><a href="#" class="nav__link">Tablets</a></div>
      <div class="nav__item"><a href="#" class="nav__link">Photo</a></div>
      <div class="nav__item"><a href="#" class="nav__link">Video</a></div>
    </nav>

  </div>
</header>

</body>
</html>
